services:
  - type: web
    name: hydrogen-hermes-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: API_SERVER_HOST
        value: "0.0.0.0"
      - key: API_SERVER_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      - key: API_SERVER_KEY
        generateValue: true
      - key: API_SERVER_CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
